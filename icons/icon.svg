<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a4a"/>
      <stop offset="0.45" stop-color="#2d7fa8"/>
      <stop offset="0.62" stop-color="#bfe8f2"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.26" r="0.18">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cfeeff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#cfeeff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9f5"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8093a5"/>
      <stop offset="0.45" stop-color="#f4f9fd"/>
      <stop offset="0.62" stop-color="#e4edf5"/>
      <stop offset="1" stop-color="#7e92a4"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- 하늘 + 빙판 -->
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="368" cy="118" r="120" fill="url(#sun)"/>

    <!-- 오로라 띠 -->
    <path d="M0 150 Q128 120 256 150 T512 150 V190 H0 Z" fill="#7affc8" opacity="0.14"/>
    <path d="M0 196 Q140 168 256 196 T512 196 V230 H0 Z" fill="#9cd2ff" opacity="0.16"/>

    <!-- 빙산 실루엣 -->
    <g fill="#b8d7eb" opacity="0.85">
      <polygon points="40,300 110,232 180,300"/>
      <polygon points="150,300 230,250 310,300"/>
      <polygon points="300,300 380,236 470,300"/>
    </g>

    <!-- 빙판 바닥 -->
    <rect x="0" y="298" width="512" height="214" fill="#eaf6ff"/>
    <path d="M256 298 L120 512 H392 Z" fill="#dff1ff"/>
    <line x1="256" y1="320" x2="256" y2="512" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 18" opacity="0.7"/>

    <!-- 펭귄(오뚜기형, 빨간 배낭은 등 뒤로 살짝 보임) -->
    <g>
      <!-- 그림자 -->
      <ellipse cx="256" cy="456" rx="118" ry="24" fill="#3a6da0" opacity="0.25"/>
      <!-- 발 -->
      <ellipse cx="224" cy="450" rx="30" ry="14" fill="#f5a623"/>
      <ellipse cx="288" cy="450" rx="30" ry="14" fill="#f5a623"/>
      <!-- 등 뒤 빨간 배낭(몸 뒤로 살짝 보임) -->
      <rect x="156" y="250" width="200" height="150" rx="48" fill="#c0392b"/>
      <rect x="156" y="250" width="200" height="40" rx="20" fill="#a82e22"/>
      <!-- 어깨 위로 넘어가는 끈 끝(얼굴엔 안 걸침) -->
      <rect x="176" y="232" width="20" height="40" rx="9" fill="#a82e22"/>
      <rect x="316" y="232" width="20" height="40" rx="9" fill="#a82e22"/>
      <!-- 몸통(오뚜기 — 위는 좁고 아래는 둥글게) -->
      <path d="M256 176 C 322 176 360 244 360 322 C 360 414 314 458 256 458 C 198 458 152 414 152 322 C 152 244 190 176 256 176 Z" fill="#1b2733"/>
      <!-- 날개(짧은 플리퍼) -->
      <ellipse cx="166" cy="338" rx="26" ry="64" fill="#11202b" transform="rotate(12 166 338)"/>
      <ellipse cx="346" cy="338" rx="26" ry="64" fill="#11202b" transform="rotate(-12 346 338)"/>
      <!-- 배(흰색, 아래로 둥글게) -->
      <ellipse cx="256" cy="364" rx="74" ry="92" fill="url(#belly)"/>
      <!-- 눈(작고 또렷) -->
      <circle cx="228" cy="296" r="16" fill="#ffffff"/>
      <circle cx="284" cy="296" r="16" fill="#ffffff"/>
      <circle cx="232" cy="299" r="8.5" fill="#10171f"/>
      <circle cx="280" cy="299" r="8.5" fill="#10171f"/>
      <circle cx="229" cy="296" r="3.2" fill="#ffffff"/>
      <circle cx="277" cy="296" r="3.2" fill="#ffffff"/>
      <!-- 눈썹(진중한 인상) -->
      <path d="M208 276 Q228 269 247 278" stroke="#0c141c" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M265 278 Q284 269 304 276" stroke="#0c141c" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- 부리 -->
      <polygon points="240,322 272,322 256,346" fill="#f5a623"/>
      <polygon points="240,322 272,322 256,334" fill="#d98f17"/>
    </g>

    <!-- Fe 통조림 깡통 (Fedora) -->
    <g transform="translate(384,366)">
      <ellipse cx="0" cy="66" rx="54" ry="12" fill="#3a6da0" opacity="0.22"/>
      <rect x="-52" y="-62" width="104" height="126" rx="8" fill="url(#tin)" stroke="#6f8294" stroke-width="3"/>
      <rect x="-46" y="-62" width="10" height="126" fill="#ffffff" opacity="0.5"/>
      <rect x="-52" y="-18" width="104" height="52" fill="#2f8fe0"/>
      <rect x="-52" y="-18" width="104" height="8" fill="#ffffff" opacity="0.25"/>
      <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">Fe</text>
      <ellipse cx="0" cy="-62" rx="52" ry="11" fill="#eef4fa" stroke="#6f8294" stroke-width="3"/>
      <ellipse cx="-16" cy="-63" rx="16" ry="3.5" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- 떨어지는 눈 -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="70" cy="90" r="6"/>
      <circle cx="140" cy="60" r="4"/>
      <circle cx="210" cy="100" r="5"/>
      <circle cx="100" cy="160" r="4"/>
      <circle cx="440" cy="120" r="5"/>
    </g>
  </g>
</svg>
