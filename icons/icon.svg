<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a4a"/>
      <stop offset="0.45" stop-color="#2d7fa8"/>
      <stop offset="0.62" stop-color="#bfe8f2"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.26" r="0.18">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cfeeff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#cfeeff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe9f5"/>
    </linearGradient>
    <linearGradient id="tinBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f8395"/>
      <stop offset="0.42" stop-color="#f6fafe"/>
      <stop offset="0.62" stop-color="#d3dde6"/>
      <stop offset="1" stop-color="#69788a"/>
    </linearGradient>
    <linearGradient id="labelBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c66a6"/>
      <stop offset="0.45" stop-color="#5fb6ef"/>
      <stop offset="0.62" stop-color="#2f8fe0"/>
      <stop offset="1" stop-color="#1a5e9c"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- 하늘 + 빙판 -->
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="368" cy="118" r="120" fill="url(#sun)"/>

    <!-- 오로라 띠 -->
    <path d="M0 150 Q128 120 256 150 T512 150 V190 H0 Z" fill="#7affc8" opacity="0.14"/>
    <path d="M0 196 Q140 168 256 196 T512 196 V230 H0 Z" fill="#9cd2ff" opacity="0.16"/>

    <!-- 빙산 실루엣 -->
    <g fill="#b8d7eb" opacity="0.85">
      <polygon points="40,300 110,232 180,300"/>
      <polygon points="150,300 230,250 310,300"/>
      <polygon points="300,300 380,236 470,300"/>
    </g>

    <!-- 빙판 바닥 -->
    <rect x="0" y="298" width="512" height="214" fill="#eaf6ff"/>
    <path d="M256 298 L120 512 H392 Z" fill="#dff1ff"/>
    <line x1="256" y1="320" x2="256" y2="512" stroke="#ffffff" stroke-width="6" stroke-dasharray="20 18" opacity="0.7"/>

    <!-- 펭귄 -->
    <g>
      <!-- 그림자 -->
      <ellipse cx="256" cy="452" rx="120" ry="26" fill="#3a6da0" opacity="0.25"/>
      <!-- 발 -->
      <ellipse cx="222" cy="446" rx="30" ry="15" fill="#f5a623"/>
      <ellipse cx="290" cy="446" rx="30" ry="15" fill="#f5a623"/>
      <!-- 몸통(검정) -->
      <ellipse cx="256" cy="338" rx="116" ry="130" fill="#1b2733"/>
      <!-- 날개 -->
      <ellipse cx="150" cy="338" rx="32" ry="86" fill="#11202b" transform="rotate(14 150 338)"/>
      <ellipse cx="362" cy="338" rx="32" ry="86" fill="#11202b" transform="rotate(-14 362 338)"/>
      <!-- 배(흰색) -->
      <ellipse cx="256" cy="356" rx="78" ry="104" fill="url(#belly)"/>
      <!-- 반달 배낭 띠: 위쪽 끝만 살짝 넓게(가장 볼록한 곳보단 좁게), 아래는 가늘게 -->
      <path d="M164 259 Q192 291 168 322 Q166 291 170 260 Z" fill="#d8392c"/>
      <path d="M348 259 Q320 291 344 322 Q346 291 342 260 Z" fill="#d8392c"/>
      <!-- 눈 -->
      <circle cx="226" cy="300" r="22" fill="#ffffff"/>
      <circle cx="286" cy="300" r="22" fill="#ffffff"/>
      <circle cx="231" cy="304" r="11" fill="#10171f"/>
      <circle cx="281" cy="304" r="11" fill="#10171f"/>
      <circle cx="227" cy="300" r="4" fill="#ffffff"/>
      <circle cx="277" cy="300" r="4" fill="#ffffff"/>
      <!-- 부리 -->
      <polygon points="240,328 272,328 256,352" fill="#f5a623"/>
      <polygon points="240,328 272,328 256,340" fill="#d98f17"/>
    </g>

    <!-- Fe 통조림(단순 3D — 위아래 테두리만, 살짝 기울임) -->
    <g transform="translate(374,372) rotate(-13)">
      <ellipse cx="10" cy="72" rx="52" ry="11" fill="#3a6da0" opacity="0.22"/>
      <!-- 캔 몸통(각진 직사각형 + 외곽선) -->
      <rect x="-48" y="-46" width="96" height="104" fill="url(#tinBody)" stroke="#6f8294" stroke-width="3"/>
      <!-- 위/아래 시밍 테두리 -->
      <rect x="-48" y="-34" width="96" height="6" fill="#9fb4c6"/>
      <rect x="-48" y="42" width="96" height="6" fill="#9fb4c6"/>
      <!-- 파란 라벨(가로 밴드) + Fe -->
      <rect x="-48" y="-12" width="96" height="44" fill="url(#labelBlue)"/>
      <rect x="-48" y="-12" width="96" height="5" fill="#ffffff" opacity="0.22"/>
      <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">Fe</text>
      <!-- 세로 하이라이트 -->
      <rect x="-31" y="-40" width="8" height="92" rx="4" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- 떨어지는 눈 -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="70" cy="90" r="6"/>
      <circle cx="140" cy="60" r="4"/>
      <circle cx="210" cy="100" r="5"/>
      <circle cx="100" cy="160" r="4"/>
      <circle cx="440" cy="120" r="5"/>
    </g>
  </g>
</svg>
