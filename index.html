<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>펭귄 남극 대원정 — Elements Shooter</title>

  <!-- 앱 아이콘 / PWA -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#16456e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="원소 슈터" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <div class="hud-item">❤ <span id="hud-lives">3</span></div>
      <div class="hud-item">🏁 <span id="hud-dist">0</span>m</div>
      <div class="hud-item">📖 <span id="hud-elem">0</span></div>
      <div class="hud-item">점수 <span id="hud-score">0</span></div>
    </div>

    <!-- 원소 설명 토스트 -->
    <div id="toast"></div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <h1>🐧 펭귄 남극 대원정</h1>
      <p class="subtitle">Antarctic Adventure</p>
      <p class="desc">
        펭귄이 빙판 길을 달린다!<br />
        <b>얼음 구덩이</b>는 <b>점프</b>로 뛰어넘고,<br />
        <b>원소 깃발</b>을 만나요:<br />
        🔵 <b>안전 원소</b> 깃발은 주워서 <b>학습 + 점수</b>,<br />
        🔴 <b>위험 원소</b>(방사능·독성) 깃발은 <b>피하세요!</b><br />
        <span class="warn">❤ 구덩이에 빠지거나 위험 원소에 닿으면 목숨이 줄고,<br />목숨이 다하면 게임 오버!</span>
      </p>
      <div class="controls-info">
        <span>🖱 좌우 이동: 마우스 / 터치 / ← →</span>
        <span>⬆️ 점프: 화면 탭 · 클릭 · Space / ↑</span>
      </div>

      <!-- 메타: 코인/최고점수/도감 + 영구 업그레이드 상점 -->
      <div id="meta">
        <div class="meta-row">
          <span>🪙 <b id="coin-total">0</b></span>
          <span>🏆 <b id="high-score">0</b></span>
          <span>📖 <b id="dex-count">0</b>/<span id="dex-max">15</span></span>
        </div>
        <div class="shop">
          <button class="up-btn" id="up-life">❤ 시작 목숨<br /><span class="up-info"></span></button>
          <button class="up-btn" id="up-jump">⬆ 점프력<br /><span class="up-info"></span></button>
          <button class="up-btn" id="up-magnet">🧲 자석<br /><span class="up-info"></span></button>
        </div>
      </div>

      <button id="start-btn" class="btn">게임 시작</button>
    </div>

    <!-- 게임오버 화면 -->
    <div id="over-screen" class="overlay hidden">
      <h1>게임 오버</h1>
      <p class="desc">최종 점수</p>
      <p id="final-score" class="final-score">0</p>
      <p id="run-coins" class="run-coins"></p>
      <p id="elements-learned" class="learned"></p>
      <button id="retry-btn" class="btn">다시 도전</button>
    </div>
  </div>

  <script src="js/elements.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
