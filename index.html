<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>펭귄 남극 대원정 — Elements Shooter</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- 상단 HUD -->
    <div id="hud">
      <div class="hud-item">🐧 <span id="hud-squad">1</span></div>
      <div class="hud-item">무기 Lv.<span id="hud-weapon">1</span></div>
      <div class="hud-item">🛡 <span id="hud-shield">0</span></div>
      <div class="hud-item">🪙 <span id="hud-coins">0</span></div>
      <div class="hud-item">점수 <span id="hud-score">0</span></div>
    </div>

    <!-- 원소 설명 토스트 -->
    <div id="toast"></div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <h1>🐧 펭귄 남극 대원정</h1>
      <p class="subtitle">Elements Shooter</p>
      <p class="desc">
        빙판을 덮치는 <b>북극곰 무리</b>를 막아라!<br />
        내려오는 <b>원소 게이트</b> 중 <b>안전한 원소</b>를 골라 쏘면<br />
        펭귄 동료가 늘고 무기가 강해집니다.<br />
        <b>방사능·독성 원소</b>는 피하세요!<br />
        <span class="warn">🐧 펭귄이 곧 목숨 — 몬스터에게 뚫리면 1마리씩 잃고,<br />모두 사라지면 게임 오버!</span>
      </p>
      <div class="controls-info">
        <span>🖱 좌우 이동: 마우스 / 터치 / ← →</span>
        <span>❄️ 눈덩이 사격: 자동</span>
      </div>

      <!-- 메타: 코인/최고점수/도감 + 영구 업그레이드 상점 -->
      <div id="meta">
        <div class="meta-row">
          <span>🪙 <b id="coin-total">0</b></span>
          <span>🏆 <b id="high-score">0</b></span>
          <span>📖 <b id="dex-count">0</b>/<span id="dex-max">15</span></span>
        </div>
        <div class="shop">
          <button class="up-btn" id="up-squad">🐧 시작 펭귄<br /><span class="up-info"></span></button>
          <button class="up-btn" id="up-weapon">🔫 시작 무기<br /><span class="up-info"></span></button>
          <button class="up-btn" id="up-shield">🛡 시작 보호막<br /><span class="up-info"></span></button>
        </div>
      </div>

      <button id="start-btn" class="btn">게임 시작</button>
    </div>

    <!-- 게임오버 화면 -->
    <div id="over-screen" class="overlay hidden">
      <h1>게임 오버</h1>
      <p class="desc">최종 점수</p>
      <p id="final-score" class="final-score">0</p>
      <p id="run-coins" class="run-coins"></p>
      <p id="elements-learned" class="learned"></p>
      <button id="retry-btn" class="btn">다시 도전</button>
    </div>
  </div>

  <script src="js/elements.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
