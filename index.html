<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>펭귄 남극 대원정 — Elements Shooter</title>

  <!-- 앱 아이콘 / PWA -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#16456e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="원소 슈터" />

  <link rel="stylesheet" href="css/style.css?v=59" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- 원소 설명 토스트 -->
    <div id="toast"></div>

    <!-- 모바일 조작 버튼(삼각 배치, 한 손 조작) -->
    <div id="touch-controls" class="rh">
      <div class="tc-pad">
        <button class="tc-btn tc-up" id="btn-jump" aria-label="점프·날기·던지기">▲</button>
        <button class="tc-btn tc-l" id="btn-left" aria-label="왼쪽">◀</button>
        <button class="tc-btn tc-r" id="btn-right" aria-label="오른쪽">▶</button>
      </div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
      <h1>🐧 펭귄 남극 대원정</h1>
      <p class="subtitle">Antarctic Adventure</p>
      <div class="howto">
        <div class="ht"><span class="ht-i">🗺️</span><span><b>남극 → 북극</b> 세계 일주! 상단 지도로 경로 확인</span></div>
        <div class="ht"><span class="ht-i">🥫</span><span><b>정어리 통조림</b> 모으고 <b>🔧 따개</b>로 까서 <b>⚡에너지</b> 충전</span></div>
        <div class="ht"><span class="ht-i">⬆️</span><span><b>점프</b>로 크레바스 넘기 · <b>꾹 눌러</b> 날아서 거대 협곡 건너기</span></div>
        <div class="ht warn"><span class="ht-i">❄️</span><span>에너지 없으면 못 날고, <b>협곡 가운데 빠지면 아웃!</b></span></div>
        <div class="ht"><span class="ht-i">🐻‍❄️</span><span>끝에서 <b>북극곰 보스</b>! <b>탭=통조림 던지기</b>로 잡으면 방향 반전·<b>바다표범</b>전</span></div>
      </div>
      <p class="controls-line">🖱 이동: 마우스·터치·←→ &nbsp;·&nbsp; ⬆️ 점프/비행: 클릭·탭·Space <b>꾹</b></p>

      <!-- 메타: 최고점수/도감 + 조작 손 -->
      <div id="meta">
        <div class="meta-row">
          <span>🏆 <b id="high-score">0</b></span>
          <span>📖 <b id="dex-count">0</b>/<span id="dex-max">25</span></span>
        </div>
        <div class="hand-row">📱 조작 손: <button id="hand-toggle" class="hand-btn">오른손잡이</button></div>
      </div>

      <button id="start-btn" class="btn">게임 시작</button>
    </div>

    <!-- 게임오버 화면 -->
    <div id="over-screen" class="overlay hidden">
      <h1>🐧 여정 종료</h1>
      <div class="result">
        <p class="result-label">최종 점수</p>
        <p id="final-score" class="final-score">0</p>
        <p id="run-coins" class="run-coins"></p>
        <p id="elements-learned" class="learned"></p>
      </div>
      <button id="retry-btn" class="btn">다시 도전</button>
    </div>

    <!-- 보스 격파 → 귀환 메시지 화면 -->
    <div id="relay-screen" class="overlay hidden">
      <h1 id="relay-title">정복!</h1>
      <div class="result">
        <p id="relay-msg" class="relay-msg"></p>
      </div>
      <button id="relay-btn" class="btn">계속</button>
    </div>
  </div>

  <script src="js/elements.js?v=59"></script>
  <script src="js/game.js?v=59"></script>
</body>
</html>
